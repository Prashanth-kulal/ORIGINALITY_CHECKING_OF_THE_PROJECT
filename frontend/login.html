<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Project Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-page);
      color: var(--text-primary);
      transition: background-color var(--transition-normal), color var(--transition-normal);
    }

    /* Left Panel - Hero Image & Branding */
    .left-panel {
      flex: 1.1;
      background: linear-gradient(135deg, rgba(13, 148, 136, 0.45), rgba(15, 23, 42, 0.60)),
                  url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 40px;
      position: relative;
      transition: background var(--transition-normal);
    }

    [data-theme="dark"] .left-panel,
    .dark-theme .left-panel {
      background: linear-gradient(135deg, rgba(13, 148, 136, 0.38), rgba(11, 15, 25, 0.76)),
                  url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") no-repeat center center/cover;
    }

    .left-panel div {
      position: relative;
      z-index: 1;
      max-width: 480px;
    }

    .left-panel h1 {
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .left-panel p {
      font-size: 16px;
      opacity: 0.95;
      line-height: 1.6;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    /* Right Panel - Form Container */
    .right-panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-page);
      padding: 40px 24px;
      overflow-y: auto;
    }

    .form-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      padding: 40px 36px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-lg);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    .form-container:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-xl);
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      font-weight: 600;
      color: var(--text-primary);
      font-size: 28px;
    }

    label {
      font-size: 13.5px;
      font-weight: 500;
      display: block;
      margin: 12px 0 6px;
      color: var(--text-secondary);
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      margin-bottom: 14px;
      font-size: 14px;
      background: var(--input-bg);
      color: var(--input-text);
      transition: all var(--transition-fast);
    }

    input:focus, select:focus {
      border-color: var(--accent-primary) !important;
      box-shadow: 0 0 0 3px var(--accent-glow) !important;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent-gradient, linear-gradient(135deg, #0d9488, #14b8a6));
      border: none;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 6px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .submit-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px var(--accent-glow);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .extra-links {
      text-align: center;
      margin-top: 18px;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .extra-links a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 600;
      margin-left: 5px;
      transition: color var(--transition-fast);
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    /* GOOGLE BUTTON */
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      border-radius: var(--radius-md);
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      font-weight: 600;
      font-size: 14.5px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s ease;
    }

    .google-btn img {
      width: 20px;
      height: 20px;
    }

    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-default);
    }

    .google-btn:active {
      transform: scale(0.98);
    }

    .google-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: skewX(-25deg);
    }

    .google-btn:hover::before {
      animation: shine 1s ease forwards;
    }

    @keyframes shine {
      100% { left: 125%; }
    }

    .google-btn::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #4285F4, #EA4335, #FBBC05, #34A853);
    }

    /* Responsive Adaptation (Phase 5) */
    @media (max-width: 900px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
        flex-direction: column;
      }

      .left-panel {
        flex: none;
        width: 100%;
        min-height: 220px;
        max-height: 250px;
        padding: 30px 20px 24px;
        background-position: center 25%;
        background-size: cover;
      }

      .left-panel h1 {
        font-size: 26px;
        margin-bottom: 6px;
      }

      .left-panel p {
        font-size: 14px;
        line-height: 1.4;
      }

      .right-panel {
        flex: 1;
        width: 100%;
        min-height: auto;
        padding: 24px 16px 40px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .form-container {
        margin-top: 0;
        padding: 28px 22px;
        box-shadow: var(--shadow-lg);
        max-width: 440px;
      }
    }
  </style>
</head>
<body class="role-auth">

  <!-- Floating Theme Toggle (Strictly outside form) -->
  <button type="button" class="auth-theme-toggle theme-toggle-btn" id="authThemeToggleBtn" title="Switch Theme" aria-label="Toggle light or dark theme">
    <span class="theme-toggle-icon">🌙</span>
  </button>

  <!-- Left Panel -->
  <div class="left-panel">
    <div>
      <h1>Welcome Back!</h1>
      <p>Login to manage your projects, tasks, and progress efficiently</p>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="form-container">
      <div style="margin-bottom: 18px; text-align: left;">
        <a href="landing.html" style="font-size: 13px; color: var(--text-secondary); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; transition: color var(--transition-fast);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back to PROJECTVERSE
        </a>
      </div>
      <h2>Login</h2>
      <form id="loginForm">
        <label for="email">Email or USN</label>
        <input type="text" id="email" placeholder="Enter Email or USN (e.g. 4MW23CS001)" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">

        <div style="display: flex; justify-content: flex-end; margin-top: -6px; margin-bottom: 12px;">
          <a href="forgot-password.html" style="font-size: 13px; color: var(--accent-primary); text-decoration: none; font-weight: 500; transition: color var(--transition-fast);">Forgot Password?</a>
        </div>

        <label for="role">Select Role</label>
        <select id="role" required>
          <option value="">-- Select Role --</option>
          <option value="team">Student (Team)</option>
          <option value="faculty">Faculty</option>
          <option value="coordinator">Project Coordinator</option>
        </select>

        <button type="submit" class="submit-btn" id="loginSubmitBtn">Login</button>

        <div class="extra-links">
          <p>Don't have an account? <a href="index.html">Register here</a></p>
        </div>
      </form>
      <a href="https://originality-checking-of-the-project.onrender.com/login/google?prompt=select_account" class="google-btn">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo">
        Continue with Google
      </a>
    </div>
  </div>

  <script>
    // Pre-select role if arriving from landing page role portal link
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const preRole = urlParams.get("role");
      if (preRole && ["team", "faculty", "coordinator"].includes(preRole)) {
        const roleDropdown = document.getElementById("role");
        if (roleDropdown) roleDropdown.value = preRole;
      }
    } catch (e) {
      console.warn("Could not parse role query param", e);
    }

    document.getElementById("loginForm").addEventListener("submit", async function(e){
      e.preventDefault();

      const identityInput = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;

      if(!role){
        alert("Please select a role");
        return;
      }

      const submitBtn = document.getElementById("loginSubmitBtn");
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";
      }

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: identityInput, usn: identityInput, identity: identityInput, password, role })
        });

        const data = await res.json();

        if(res.ok){
          localStorage.setItem("token", data.token);
          if (data.user) {
            localStorage.setItem("user", JSON.stringify(data.user));
          }
          window.location.href = data.redirect; // Redirects automatically
        } else {
          alert(data.error);
        }
      } catch(err){
        console.error(err);
        alert("Server error, try again later.");
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Login";
        }
      }
    });
  </script>

</body>
</html>
