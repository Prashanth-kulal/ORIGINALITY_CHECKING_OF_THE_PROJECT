<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Project Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #eef2f7;
    }

    /* Left Panel */
    .left-panel {
      flex: 1;
      background: url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 40px;
      position: relative;
    }
    .left-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
    }
    .left-panel div { position: relative; z-index: 1; }
    .left-panel h1 { font-size: 42px; font-weight: 700; margin-bottom: 10px; line-height: 1.2; }
    .left-panel p { font-size: 18px; opacity: 0.9; }

    /* Right Panel */
    .right-panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 40px;
    }

    .form-container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .form-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }

    h2 { text-align: center; margin-bottom: 30px; font-weight: 600; color: #333; font-size: 28px; }

    label { font-size: 14px; font-weight: 500; display: block; margin: 10px 0 5px; }
    input, select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    input:focus, select:focus {
      border-color: #0072ff;
      box-shadow: 0 0 10px rgba(0, 114, 255, 0.2);
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      border: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    .submit-btn:hover {
      opacity: 0.95;
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(0, 114, 255, 0.3);
    }

    .extra-links { text-align: center; margin-top: 18px; font-size: 14px; color: #666; }
    .extra-links a { color: #0072ff; text-decoration: none; font-weight: 500; margin-left: 5px; }
    .extra-links a:hover { text-decoration: underline; }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .left-panel, .right-panel { flex: none; width: 100%; height: 50vh; }
      .form-container { margin-top: -50px; }
    }

      /* GOOGLE BUTTON */
      .google-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 14px;
        margin-top: 15px;
        border-radius: 12px;
        background: #fff;
        color: #333;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        position: relative;
        overflow: hidden;
        box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
      }

      /* GOOGLE LOGO */
      .google-btn img {
        width: 22px;
        height: 22px;
      }

      /* HOVER EFFECT */
      .google-btn:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      }

      /* CLICK EFFECT */
      .google-btn:active {
        transform: scale(0.97);
      }

      /* GLOW ANIMATION */
      .google-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -75%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
          120deg,
          transparent,
          rgba(255,255,255,0.6),
          transparent
        );
        transform: skewX(-25deg);
      }

      /* ANIMATION LOOP */
      .google-btn:hover::before {
        animation: shine 1s ease forwards;
      }

      @keyframes shine {
        100% {
          left: 125%;
        }
      }

      /* COLOR STRIP GLOW (Google Colors) */
      .google-btn::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(
          90deg,
          #4285F4,
          #EA4335,
          #FBBC05,
          #34A853
        );
        animation: flow 3s linear infinite;
      }

      @keyframes flow {
        0% { background-position: 0%; }
        100% { background-position: 200%; }
      }
  </style>
</head>
<body>

  <!-- Left Panel -->
  <div class="left-panel">
    <div>
      <h1>Welcome Back!</h1>
      <p>Login to manage your projects, tasks, and progress efficiently</p>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="form-container">
      <h2>Login</h2>
      <form id="loginForm">
        <label>Email or USN</label>
        <input type="text" id="email" placeholder="Enter Email or USN (e.g. 4MW23CS001)" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <label>Select Role</label>
        <select id="role" required>
          <option value="">-- Select Role --</option>
          <option value="team">Student (Team)</option>
          <option value="faculty">Faculty</option>
          <option value="coordinator">Project Coordinator</option>
        </select>

        <button type="submit" class="submit-btn">Login</button>

        <div class="extra-links">
          <p>Don’t have an account? <a href="index.html">Register here</a></p>
        </div>
      </form>
      <a href="/login/google?prompt=select_account" class="google-btn">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo">
        Continue with Google
      </a>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e){
      e.preventDefault();

      const identityInput = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;

      if(!role){
        alert("Please select a role");
        return;
      }

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: identityInput, usn: identityInput, identity: identityInput, password, role })
        });

        const data = await res.json();

        if(res.ok){
          localStorage.setItem("token", data.token);
          if (data.user) {
            localStorage.setItem("user", JSON.stringify(data.user));
          }
          window.location.href = data.redirect; // Redirects automatically
        } else {
          alert(data.error);
        }
      } catch(err){
        console.error(err);
        alert("Server error, try again later.");
      }
    });
  </script>

</body>
</html>
