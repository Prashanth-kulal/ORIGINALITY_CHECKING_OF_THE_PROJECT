<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Portal | Student Project Management</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 0;
  }

  .container {
    width: 600px;
    max-height: 90vh;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    position: relative;
    z-index: 1;
    overflow-y: auto;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
    color: #fff;
  }

  .header h2 { font-size: 28px; }
  .toggle-btns {
    display: flex;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .toggle-btns button {
    flex: 1;
    padding: 12px;
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-weight: bold;
  }

  .toggle-btns button.active { background: #00c6ff; }

  form { display: none; color: #fff; }
  form.active { display: block; }

  label { font-size: 14px; font-weight: bold; margin-top: 10px; display: block; }
  input { width: 100%; padding: 10px; border-radius: 10px; border: none; background: rgba(255,255,255,0.2); color: #fff; margin-bottom: 12px; }
  input::placeholder { color: #ddd; }

  .submit-btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg,#00c6ff,#0072ff);
    color: #fff; font-size: 16px; font-weight: bold; cursor: pointer;
  }

  .back-link { text-align: center; margin-top: 15px; }
  .back-link a { color: #00c6ff; text-decoration: none; font-weight: 500; }
  .back-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Registration Portal</h2>
    <p>Intelligent Student Project Management System</p>
  </div>

  <div class="toggle-btns">
    <button id="teamTab" class="active" onclick="showForm('team')">Team Registration</button>
    <button id="facultyTab" onclick="showForm('faculty')">Faculty Registration</button>
  </div>

  <!-- TEAM FORM -->
  <form id="teamForm" class="active">
    <label>Team Name</label>
    <input type="text" id="teamName" placeholder="Enter team name" required>

    <label>Leader Name</label>
    <input type="text" id="leaderName" placeholder="Enter leader name" required>

    <label>Leader USN</label>
    <input type="text" id="leaderUsn" placeholder="Enter leader USN (e.g. 4MW23CS001)" required style="text-transform: uppercase;">

    <label>Leader Email</label>
    <input type="email" id="leaderEmail" placeholder="Enter leader email" required>

    <label>Password</label>
    <input type="password" id="leaderPassword" placeholder="Enter password" required>

    <label>Team Members Details</label>
    <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 15px;">
      <p style="font-size: 13px; font-weight: bold; color: #00c6ff; margin-bottom: 8px;">Member 1</p>
      <input type="text" id="member1Name" placeholder="Member 1 Name" required>
      <input type="text" id="member1Usn" placeholder="Member 1 USN (e.g. 4MW23CS002)" required style="text-transform: uppercase;">
      <input type="email" id="member1Email" placeholder="Member 1 Email" required>

      <p style="font-size: 13px; font-weight: bold; color: #00c6ff; margin-bottom: 8px; margin-top: 10px;">Member 2</p>
      <input type="text" id="member2Name" placeholder="Member 2 Name" required>
      <input type="text" id="member2Usn" placeholder="Member 2 USN (e.g. 4MW23CS003)" required style="text-transform: uppercase;">
      <input type="email" id="member2Email" placeholder="Member 2 Email" required>

      <p style="font-size: 13px; font-weight: bold; color: #00c6ff; margin-bottom: 8px; margin-top: 10px;">Member 3 (Optional)</p>
      <input type="text" id="member3Name" placeholder="Member 3 Name">
      <input type="text" id="member3Usn" placeholder="Member 3 USN" style="text-transform: uppercase;">
      <input type="email" id="member3Email" placeholder="Member 3 Email">

      <p style="font-size: 13px; font-weight: bold; color: #00c6ff; margin-bottom: 8px; margin-top: 10px;">Member 4 (Optional)</p>
      <input type="text" id="member4Name" placeholder="Member 4 Name">
      <input type="text" id="member4Usn" placeholder="Member 4 USN" style="text-transform: uppercase;">
      <input type="email" id="member4Email" placeholder="Member 4 Email">
    </div>

    <label>Team Interests</label>
    <input type="text" id="interest1" placeholder="Interest 1" required>
    <input type="text" id="interest2" placeholder="Interest 2" required>
    <input type="text" id="interest3" placeholder="Interest 3" required>
    <input type="text" id="interest4" placeholder="Interest 4" required>

    <button type="submit" class="submit-btn">Register Team</button>

    <div class="back-link">
      <p>Already have an account? <a href="login.html">Back to Login</a></p>
    </div>
  </form>

  <!-- FACULTY FORM -->
  <form id="facultyForm">
    <label>Name</label><input type="text" id="facultyName" placeholder="Enter name" required>
    <label>Email</label><input type="email" id="facultyEmail" placeholder="Enter email" required>
    <label>Password</label><input type="password" id="facultyPassword" placeholder="Enter password" required>
    <label>Expertise Areas</label>
    <input type="text" id="exp1" placeholder="Expertise 1" required>
    <input type="text" id="exp2" placeholder="Expertise 2" required>
    <input type="text" id="exp3" placeholder="Expertise 3" required>
    <input type="text" id="exp4" placeholder="Expertise 4" required>
    <button type="submit" class="submit-btn">Register Faculty</button>

    <div class="back-link">
      <p>Already have an account? <a href="login.html">Back to Login</a></p>
    </div>
  </form>
</div>

<script>
function showForm(type) {
  document.querySelectorAll("form").forEach(f => f.classList.remove("active"));
  document.getElementById(type + "Form").classList.add("active");
  document.querySelectorAll(".toggle-btns button").forEach(b => b.classList.remove("active"));
  document.getElementById(type + "Tab").classList.add("active");
}

// TEAM REGISTRATION
document.querySelector("#teamForm").addEventListener("submit", async e => {
  e.preventDefault();

  const members = [];
  [1, 2, 3, 4].forEach(idx => {
    const nameEl = document.getElementById(`member${idx}Name`);
    const usnEl = document.getElementById(`member${idx}Usn`);
    const emailEl = document.getElementById(`member${idx}Email`);

    const name = nameEl ? nameEl.value.trim() : "";
    const usn = usnEl ? usnEl.value.trim().toUpperCase().replace(/\s+/g, "") : "";
    const email = emailEl ? emailEl.value.trim().toLowerCase() : "";

    if (name || usn || email) {
      members.push({ name, usn, email });
    }
  });

  const interests = [interest1.value, interest2.value, interest3.value, interest4.value].map(i => i.trim()).filter(Boolean);

  const payload = {
    team_name: teamName.value.trim(),
    leader_name: leaderName.value.trim(),
    leader_usn: leaderUsn.value.trim().toUpperCase().replace(/\s+/g, ""),
    leader_email: leaderEmail.value.trim().toLowerCase(),
    leader_password: leaderPassword.value,
    members,
    interests
  };

  try {
    const res = await fetch("/api/register/team", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    alert(data.message || data.error);
    if (res.ok) {
      document.getElementById("teamForm").reset();
      window.location.href = "login.html";
    }
  } catch (err) {
    alert("Error connecting to server.");
  }
});

// FACULTY REGISTRATION
document.querySelector("#facultyForm").addEventListener("submit", async e => {
  e.preventDefault();

  const expertise = [exp1.value, exp2.value, exp3.value, exp4.value].filter(Boolean);

  const payload = {
    name: facultyName.value,
    email: facultyEmail.value,
    password: facultyPassword.value,
    expertise
  };

  try {
    const res = await fetch("/api/register/faculty", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    alert(data.message || data.error);
  } catch (err) {
    alert("Error connecting to server.");
  }
  document.getElementById("facultyForm").reset(); // for faculty form

});

const params = new URLSearchParams(window.location.search);

const email = params.get("email");
const name = params.get("name");

if (email) {
  document.getElementById("leaderEmail").value = email;
  document.getElementById("facultyEmail").value = email;
}

if (name) {
  document.getElementById("leaderName").value = name;
  document.getElementById("facultyName").value = name;
}

</script>

</body>
</html>
