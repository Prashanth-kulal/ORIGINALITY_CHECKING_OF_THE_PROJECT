<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Portal | Student Project Management</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, rgba(13, 148, 136, 0.45), rgba(15, 23, 42, 0.65)),
                url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center/cover;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
    color: var(--text-primary);
    overflow-y: auto;
  }

  [data-theme="dark"] body,
  .dark-theme body {
    background: linear-gradient(135deg, rgba(13, 148, 136, 0.35), rgba(11, 15, 25, 0.82)),
                url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center/cover;
    background-attachment: fixed;
  }

  .container {
    width: 100%;
    max-width: 620px;
    max-height: 92vh;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 32px 28px;
    box-shadow: var(--shadow-xl);
    position: relative;
    z-index: 1;
    overflow-y: auto;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .header {
    text-align: center;
    margin-bottom: 22px;
  }

  .header h2 {
    font-size: 26px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .header p {
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .toggle-btns {
    display: flex;
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: 22px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface-subtle);
    padding: 3px;
    gap: 4px;
  }

  .toggle-btns button {
    flex: 1;
    padding: 10px 14px;
    border: none;
    cursor: pointer;
    background: transparent;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 14px;
    border-radius: var(--radius-sm);
    transition: all 0.2s ease;
  }

  .toggle-btns button.active {
    background: var(--accent-primary);
    color: #ffffff;
    box-shadow: var(--shadow-sm);
  }

  form {
    display: none;
  }

  form.active {
    display: block;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  label {
    font-size: 13px;
    font-weight: 600;
    margin-top: 12px;
    margin-bottom: 4px;
    display: block;
    color: var(--text-secondary);
  }

  input {
    width: 100%;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--input-text);
    margin-bottom: 10px;
    font-size: 13.5px;
    transition: all var(--transition-fast);
  }

  input:focus {
    border-color: var(--accent-primary) !important;
    box-shadow: 0 0 0 3px var(--accent-glow) !important;
    outline: none;
  }

  .member-box {
    background: var(--bg-surface-subtle);
    border: 1px solid var(--border-subtle);
    padding: 14px;
    border-radius: var(--radius-md);
    margin-bottom: 14px;
  }

  .member-box p {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-primary);
    margin-bottom: 8px;
  }

  .submit-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: var(--radius-md);
    background: var(--accent-gradient, linear-gradient(135deg, #0d9488, #14b8a6));
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.25s ease;
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  .submit-btn:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px var(--accent-glow);
  }

  .back-link {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .back-link a {
    color: var(--accent-primary);
    text-decoration: none;
    font-weight: 600;
    margin-left: 4px;
  }

  .back-link a:hover {
    text-decoration: underline;
  }

  @media (max-width: 640px) {
    .container {
      padding: 24px 18px;
      max-height: 95vh;
    }
    .header h2 {
      font-size: 22px;
    }
  }
</style>
</head>
<body class="role-auth">

<!-- Floating Theme Toggle Button -->
<button type="button" class="auth-theme-toggle theme-toggle-btn" id="authThemeToggleBtn" title="Switch Theme" aria-label="Toggle light or dark theme">
  <span class="theme-toggle-icon">🌙</span>
</button>

<div class="container">
  <div class="header">
    <h2>Registration Portal</h2>
    <p>Student Project Management System</p>
  </div>

  <div class="toggle-btns">
    <button type="button" id="teamTab" class="active" onclick="showForm('team')">Team Registration</button>
    <button type="button" id="facultyTab" onclick="showForm('faculty')">Faculty Registration</button>
  </div>

  <!-- TEAM FORM -->
  <form id="teamForm" class="active">
    <label for="teamName">Team Name</label>
    <input type="text" id="teamName" placeholder="Enter team name" required>

    <label for="leaderName">Leader Name</label>
    <input type="text" id="leaderName" placeholder="Enter leader name" required>

    <label for="leaderUsn">Leader USN</label>
    <input type="text" id="leaderUsn" placeholder="Enter leader USN (e.g. 4MW23CS001)" required style="text-transform: uppercase;">

    <label for="leaderEmail">Leader Email</label>
    <input type="email" id="leaderEmail" placeholder="Enter leader email" required>

    <label for="leaderPassword">Password</label>
    <input type="password" id="leaderPassword" placeholder="Enter password" required>

    <label>Team Members Details</label>
    <div class="member-box">
      <p>Member 1</p>
      <input type="text" id="member1Name" placeholder="Member 1 Name" required>
      <input type="text" id="member1Usn" placeholder="Member 1 USN (e.g. 4MW23CS002)" required style="text-transform: uppercase;">
      <input type="email" id="member1Email" placeholder="Member 1 Email" required>

      <p style="margin-top: 10px;">Member 2</p>
      <input type="text" id="member2Name" placeholder="Member 2 Name" required>
      <input type="text" id="member2Usn" placeholder="Member 2 USN (e.g. 4MW23CS003)" required style="text-transform: uppercase;">
      <input type="email" id="member2Email" placeholder="Member 2 Email" required>

      <p style="margin-top: 10px;">Member 3 (Optional)</p>
      <input type="text" id="member3Name" placeholder="Member 3 Name">
      <input type="text" id="member3Usn" placeholder="Member 3 USN" style="text-transform: uppercase;">
      <input type="email" id="member3Email" placeholder="Member 3 Email">

      <p style="margin-top: 10px;">Member 4 (Optional)</p>
      <input type="text" id="member4Name" placeholder="Member 4 Name">
      <input type="text" id="member4Usn" placeholder="Member 4 USN" style="text-transform: uppercase;">
      <input type="email" id="member4Email" placeholder="Member 4 Email">
    </div>

    <label>Team Interests</label>
    <input type="text" id="interest1" placeholder="Interest 1" required>
    <input type="text" id="interest2" placeholder="Interest 2" required>
    <input type="text" id="interest3" placeholder="Interest 3" required>
    <input type="text" id="interest4" placeholder="Interest 4" required>

    <button type="submit" class="submit-btn" id="btnRegisterTeam">Register Team</button>

    <div class="back-link">
      <p>Already have an account? <a href="login.html">Back to Login</a></p>
    </div>
  </form>

  <!-- FACULTY FORM -->
  <form id="facultyForm">
    <label for="facultyName">Name</label>
    <input type="text" id="facultyName" placeholder="Enter name" required>

    <label for="facultyEmail">Email</label>
    <input type="email" id="facultyEmail" placeholder="Enter email" required>

    <label for="facultyPassword">Password</label>
    <input type="password" id="facultyPassword" placeholder="Enter password" required>

    <label>Expertise Areas</label>
    <input type="text" id="exp1" placeholder="Expertise 1" required>
    <input type="text" id="exp2" placeholder="Expertise 2" required>
    <input type="text" id="exp3" placeholder="Expertise 3" required>
    <input type="text" id="exp4" placeholder="Expertise 4" required>

    <button type="submit" class="submit-btn" id="btnRegisterFaculty">Register Faculty</button>

    <div class="back-link">
      <p>Already have an account? <a href="login.html">Back to Login</a></p>
    </div>
  </form>
</div>

<script>
function showForm(type) {
  document.querySelectorAll("form").forEach(f => f.classList.remove("active"));
  document.getElementById(type + "Form").classList.add("active");
  document.querySelectorAll(".toggle-btns button").forEach(b => b.classList.remove("active"));
  document.getElementById(type + "Tab").classList.add("active");
}

// TEAM REGISTRATION
document.querySelector("#teamForm").addEventListener("submit", async e => {
  e.preventDefault();

  const members = [];
  [1, 2, 3, 4].forEach(idx => {
    const nameEl = document.getElementById(`member${idx}Name`);
    const usnEl = document.getElementById(`member${idx}Usn`);
    const emailEl = document.getElementById(`member${idx}Email`);

    const name = nameEl ? nameEl.value.trim() : "";
    const usn = usnEl ? usnEl.value.trim().toUpperCase().replace(/\s+/g, "") : "";
    const email = emailEl ? emailEl.value.trim().toLowerCase() : "";

    if (name || usn || email) {
      members.push({ name, usn, email });
    }
  });

  const interests = [interest1.value, interest2.value, interest3.value, interest4.value].map(i => i.trim()).filter(Boolean);

  const payload = {
    team_name: teamName.value.trim(),
    leader_name: leaderName.value.trim(),
    leader_usn: leaderUsn.value.trim().toUpperCase().replace(/\s+/g, ""),
    leader_email: leaderEmail.value.trim().toLowerCase(),
    leader_password: leaderPassword.value,
    members,
    interests
  };

  const btn = document.getElementById("btnRegisterTeam");
  if (btn) { btn.disabled = true; btn.textContent = "Registering..."; }

  try {
    const res = await fetch("/api/register/team", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    alert(data.message || data.error);
    if (res.ok) {
      document.getElementById("teamForm").reset();
      window.location.href = "login.html";
    }
  } catch (err) {
    alert("Error connecting to server.");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Register Team"; }
  }
});

// FACULTY REGISTRATION
document.querySelector("#facultyForm").addEventListener("submit", async e => {
  e.preventDefault();

  const expertise = [exp1.value, exp2.value, exp3.value, exp4.value].filter(Boolean);

  const payload = {
    name: facultyName.value,
    email: facultyEmail.value,
    password: facultyPassword.value,
    expertise
  };

  const btn = document.getElementById("btnRegisterFaculty");
  if (btn) { btn.disabled = true; btn.textContent = "Registering..."; }

  try {
    const res = await fetch("/api/register/faculty", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    alert(data.message || data.error);
    if (res.ok) {
      document.getElementById("facultyForm").reset();
      window.location.href = "login.html";
    }
  } catch (err) {
    alert("Error connecting to server.");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Register Faculty"; }
  }
});

const params = new URLSearchParams(window.location.search);
const email = params.get("email");
const name = params.get("name");

if (email) {
  document.getElementById("leaderEmail").value = email;
  document.getElementById("facultyEmail").value = email;
}

if (name) {
  document.getElementById("leaderName").value = name;
  document.getElementById("facultyName").value = name;
}
</script>

</body>
</html>
